name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.401'
      - name: Build and logic tests
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: WPF smoke
        shell: pwsh
        run: ./scripts/Test-Desktop.ps1
      - name: WPF UI harness (both cultures)
        shell: pwsh
        run: ./scripts/Test-UiHarness.ps1
      - name: BLE worker recovery (demo only)
        shell: pwsh
        run: ./scripts/Test-BleRecovery.ps1
      - name: Verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: artifacts/
          retention-days: 14
